# 域名嗅探：
# 尝试从 HTTP / TLS / QUIC 连接中识别域名，让缺少域名的连接也有机会按域名规则分流。
# 能否识别取决于协议中是否有可读取的域名信息；并非所有裸 IP 连接都能识别。
sniffer:
  enable: true
  override-destination: false
  sniff:
    QUIC:
      ports:
      - 443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true # HTTP 使用识别出的 Host 作为目标
  # force-domain: []
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - "+.oray.com"
  - "+.sunlogin.net"
  - "+.push.apple.com"
  parse-pure-ip: true # 当前设置下尝试识别无域名连接；已有 Fake-IP 域名的连接无需重复识别
